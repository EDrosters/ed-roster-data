name: Refresh Roster Data

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch:          # lets you trigger it manually too

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Run roster refresh script
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: python refresh_roster.py

      - name: Commit updated data
        run: |
          git config user.name "roster-bot"
          git config user.email "actions@github.com"
          git add roster_data.json consultant_roster.json my_roster.json
          git diff --staged --quiet || git commit -m "Auto-refresh roster data"
          git push
